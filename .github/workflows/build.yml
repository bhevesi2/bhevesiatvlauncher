name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # a build whose checks fail is not released
      - name: Unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: launcher
          path: launcher.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: launcher.apk
          make_latest: "true"

      # after the release, so it never holds one up: Android's code checks, kept as a report
      - name: Lint
        if: always()
        continue-on-error: true
        run: |
          gradle :app:lintRelease --no-daemon
          echo "Lint findings by kind:"
          grep -oE "(Error|Warning): .*\[[A-Za-z]+\]$" app/build/reports/lint-results.txt | sed -E 's/^(Error|Warning): .*\[([A-Za-z]+)\]$/\1 \2/' | sort | uniq -c | sort -rn || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-release.html
          if-no-files-found: ignore
